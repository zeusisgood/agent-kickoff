# Claude Code 用（使わないなら削除）。
# PR や issue のコメントで @claude を呼ぶと Claude が答える（rules 付録 B-1）。
# 認証はサブスクリプション用トークン（API 課金なし）。手元と同じ利用枠を使うので、上限で暴走を止める。
# security-audit の全体の監査は上限に収まらない。ローカルかクラウドセッションで回す（rules-adr 0018）。
# 事前に: claude setup-token でトークンを作り、gh secret set CLAUDE_CODE_OAUTH_TOKEN で登録する。
name: Claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: "--max-turns 100"
